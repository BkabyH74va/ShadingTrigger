workflows:
  ios-build:
    name: Build unsigned iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Build unsigned IPA
        script: |
          set -euo pipefail
          
          # Find project
          PROJECT_PATH=$(find . -maxdepth 3 -name '*.xcodeproj' -print -quit)
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No .xcodeproj found"
            exit 1
          fi
          
          # Get scheme
          SCHEME=$(xcodebuild -list -project "$PROJECT_PATH" | grep -A 1 "Schemes:" | tail -1 | xargs)
          echo "Building scheme: $SCHEME"
          
          # Build unsigned archive
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath ./build/ShadingTrigger.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""
          
          # Create export options for unsigned
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string></string>
          </dict>
          </plist>
          EOF
          
          # Export unsigned IPA
          xcodebuild -exportArchive \
            -archivePath ./build/ShadingTrigger.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - build/ShadingTrigger.ipa
