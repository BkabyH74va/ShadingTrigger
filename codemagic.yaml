workflows:
  ios-build:
    name: Build iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.jasonquiles.ShadingTrigger

    scripts:
      - name: Set up project
        script: |
          set -euo pipefail
          
          # Find the Xcode project
          PROJECT_PATH=$(find . -maxdepth 3 \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -print -quit)
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No .xcodeproj found"
            exit 1
          fi
          echo "Found project: $PROJECT_PATH"
          
          # Get the scheme name
          SCHEME=$(xcodebuild -list -project "$PROJECT_PATH" | grep -A 1 "Schemes:" | tail -1 | xargs)
          echo "Using scheme: $SCHEME"
          
          # Set variables for later use
          echo "PROJECT_PATH=$PROJECT_PATH" >> $CM_ENV
          echo "SCHEME=$SCHEME" >> $CM_ENV

      - name: Archive and export IPA
        script: |
          set -euo pipefail
          
          # Build archive
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath ./build/ShadingTrigger.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=YOUR_TEAM_ID
          
          # Export IPA
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>YOUR_TEAM_ID</string>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath ./build/ShadingTrigger.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist

    artifacts:
      - build/ShadingTrigger.ipa
